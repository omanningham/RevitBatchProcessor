name: CI

# Builds and repository checks for pull requests and master.
# No Revit is available on hosted runners: this does not qualify any Revit
# version (see docs/agent-development.md, "Validation et état des tests").
# No paths filter on purpose: these jobs are meant to become required checks.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base...HEAD comparisons below

      - name: Determine base commit
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Whitespace errors in the change (git diff --check)
        run: git diff --check "${{ steps.base.outputs.sha }}" HEAD

      - name: Scripts listed in csproj, Markdown links, GPL headers
        run: python3 .github/scripts/check_repo.py --base "${{ steps.base.outputs.sha }}"

  solution-build:
    name: Solution build (as release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: nuget restore "RevitBatchProcessor.sln"

      # Same command as build_msi.yml. On this disposable runner the legacy addin
      # post-build events copy to the runner profile only.
      - name: Build solution
        run: |
          msbuild -version
          dotnet --list-sdks
          msbuild "RevitBatchProcessor.sln" /p:Configuration=Release /p:Platform="x64" /m

      - name: Verify installer sources exist
        shell: pwsh
        run: ./.github/scripts/verify_installer_sources.ps1

  modern-addins:
    name: Addin ${{ matrix.year }} (.NET 10, locked restore)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        year: [2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Legacy (packages.config) projects referenced by the addin, as in scripts/BuildNet10Pilot.ps1.
      - name: Restore legacy packages
        run: nuget restore "RevitBatchProcessor.sln"

      - name: Restore (locked mode)
        run: dotnet restore "BatchRvtAddin${{ matrix.year }}/BatchRvtAddin${{ matrix.year }}.csproj" --locked-mode -p:Platform=x64

      - name: Build without deployment
        run: dotnet build "BatchRvtAddin${{ matrix.year }}/BatchRvtAddin${{ matrix.year }}.csproj" --no-restore -c Release -p:Platform=x64 -p:DeployAddinOnBuild=false -p:PostBuildEvent=
