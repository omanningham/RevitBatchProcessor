name: CI

# Builds and repository checks for pull requests and master.
# No Revit is available on hosted runners: this does not qualify any Revit
# version (see docs/agent-development.md, "Validation et état des tests").
# No paths filter on purpose: these jobs are meant to become required checks.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # base...HEAD comparisons below

      - name: Determine base commit
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # HEAD is GitHub's merge commit; its first parent is the master tip
            # it was built on, so the diff contains only this PR's changes.
            base="HEAD^1"
          elif [ "${{ github.event_name }}" = "push" ] && ! echo "${{ github.event.before }}" | grep -q '^0*$'; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Whitespace errors in the change (git diff --check)
        run: git diff --check "${{ steps.base.outputs.sha }}" HEAD

      - name: Scripts listed in csproj, Markdown links, GPL headers
        run: python3 .github/scripts/check_repo.py --base "${{ steps.base.outputs.sha }}"

  solution-build:
    name: Solution build (as release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Before the solution restore, which would otherwise rewrite a stale lock file.
      - name: Locked restore of the Revit 2025-2027 addins
        run: |
          foreach ($year in 2025..2027) {
            dotnet restore "BatchRvtAddin$year/BatchRvtAddin$year.csproj" --locked-mode -p:Platform=x64
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Restore NuGet packages
        run: nuget restore "RevitBatchProcessor.sln"

      - name: Lock files unchanged by the restore
        run: git diff --exit-code -- '*packages.lock.json'

      # Same command as build_msi.yml. On this disposable runner the legacy addin
      # post-build events copy to the runner profile only.
      - name: Build solution
        run: |
          msbuild -version
          dotnet --list-sdks
          msbuild "RevitBatchProcessor.sln" /p:Configuration=Release /p:Platform="x64" /m

      - name: Verify installer sources exist
        shell: pwsh
        run: ./.github/scripts/verify_installer_sources.ps1

      # Engine probes (no Revit): IronPython 3.4.2 under .NET 10 in each 2025-2027
      # output, IronPython 2.7 under .NET Framework in the GUI output, the real
      # script host, the unit tests in tests/ and every script compiled by both
      # engines. Each output is tested as built, i.e. as the installer ships it.
      # The IronPython 2.7.12 negative control of scripts/BuildNet10Pilot.ps1 is
      # not run here (it needs a local -ControlEngineFolder).
      - name: Build engine probes
        run: |
          foreach ($probe in 'EngineProbe', 'LegacyEngineProbe') {
            dotnet build "tests/$probe/$probe.csproj" -c Release -o "probes/$probe"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Shared assemblies per output (information)
        run: |
          foreach ($folder in 'BatchRvtGUI', 'BatchRvtAddin2025', 'BatchRvtAddin2026', 'BatchRvtAddin2027') {
            foreach ($name in 'BatchRvtScriptHost.dll', 'BatchRvtUtil.dll') {
              $hash = (Get-FileHash "$folder/bin/x64/Release/$name").Hash.Substring(0, 12)
              Write-Host "$folder/$name $hash"
            }
          }

      - name: EngineProbe (Revit 2025-2027, IronPython 3.4.2, .NET 10)
        run: |
          $failed = @()
          foreach ($year in 2025..2027) {
            $addin = "BatchRvtAddin$year/bin/x64/Release"
            Write-Host "::group::EngineProbe $year"
            & ./probes/EngineProbe/EngineProbe.exe $addin "BatchRvtUtil/Scripts" $addin
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code) { Write-Host "::error::EngineProbe failed for Revit $year (exit $code)"; $failed += $year }
          }
          if ($failed) { exit 1 }

      - name: LegacyEngineProbe (GUI, IronPython 2.7, .NET Framework)
        run: |
          & ./probes/LegacyEngineProbe/LegacyEngineProbe.exe "BatchRvtGUI/bin/x64/Release" "BatchRvtUtil/Scripts" "tests"
          if ($LASTEXITCODE) { Write-Host "::error::LegacyEngineProbe failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }
