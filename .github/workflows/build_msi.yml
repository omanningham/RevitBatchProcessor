name: Build and Package

on:
  release:
    types:
      [released]

# No concurrency group on purpose: GitHub keeps only one pending run per group
# and cancels the others, which would leave a release without its installer.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # upload the installer to the release
    steps:
      # Default checkout of a release event is the tagged commit.
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Setup .NET 10 SDK (Revit 2025-2027 addins)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: nuget restore "RevitBatchProcessor.sln"

      - name: Set version from tag
        id: version_num_set
        run: ./.github/scripts/set_version.ps1 -Tag "${{ github.event.release.tag_name }}"

      - name: Build solution
        run: |
            msbuild -version
            msbuild "RevitBatchProcessor.sln" /p:Configuration=Release /p:Platform="x64" /m

      - name: Verify installer sources exist
        shell: pwsh
        run: ./.github/scripts/verify_installer_sources.ps1

      - name: Create installer file
        id: create_installer_file
        uses: Minionguyjpro/Inno-Setup-Action@ec985ef724d1fb4a05bfbc1a8e49930dc76d2b0c # v1.2.9
        with:
          path: Setup/RevitBatchProcessor.iss

      # The installer name is OutputBaseFilename, RevitBatchProcessorSetup_v{#AppDisplayVersion},
      # i.e. the raw tag: set_version.ps1 writes AppDisplayVersion from it.
      - name: Upload Release Asset
        id: upload-release-asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Setup\Output\RevitBatchProcessorSetup_${{github.event.release.tag_name}}.exe
          fail_on_unmatched_files: true

      # winget manifest for the private source (docs/winget.md), hashed from the
      # installer built above; URLs use GITHUB_REPOSITORY. Britton tags only.
      # Optional artifact: a failure is reported on the step but does not fail the job,
      # so the version PR below still runs; the manifest can be generated by hand.
      - name: Create winget manifest
        id: winget_manifest
        if: steps.version_num_set.outputs.is_britton == 'true'
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/new_winget_manifest.ps1 -Tag "${{ github.event.release.tag_name }}" -InstallerPath "Setup\Output\RevitBatchProcessorSetup_${{github.event.release.tag_name}}.exe"

      - name: Upload winget manifest
        if: steps.winget_manifest.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.winget_manifest.outputs.manifest_dir }}/*.yaml
          fail_on_unmatched_files: true

  # Version bump PR against master: README, installer script and assembly version.
  # Britton tags are vX.Y.Z-brt.N (see docs/britton-customizations.md).
  # Requires "Allow GitHub Actions to create and approve pull requests" in the
  # repository Actions settings.
  version-pr:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set version from tag
        id: version_num_set
        run: ./.github/scripts/set_version.ps1 -Tag "${{ github.event.release.tag_name }}"

      - name: Update readme with new version
        env:
          TAG_VALUE: ${{ github.event.release.tag_name }}
        run: |
          python $env:GITHUB_WORKSPACE\.github\workflows\update_readme.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          commit-message: "Update version to ${{github.event.release.tag_name}} in README, .iss and assembly info"
          title: '[Actions] Update version to ${{github.event.release.tag_name}}'
          body: 'Update version to ${{github.event.release.tag_name}} (numeric ${{ steps.version_num_set.outputs.version }}) in README, .iss and GlobalAssemblyInfo.cs.'
          branch: github-actions/update-readme
